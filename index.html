<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Stats</title>
<link rel="icon" type="image/png" href="pawn.png">
<link rel="apple-touch-icon" href="pawn.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
</head>
<body>

<!-- loading screen -->
<div id="loading-screen" class="loading-screen" aria-hidden="true">
  <div class="loading-stage">
    <div class="loading-rank">
      <span class="loading-sq"></span><span class="loading-sq"></span><span class="loading-sq"></span>
      <span class="loading-sq"></span><span class="loading-sq"></span><span class="loading-sq"></span>
      <span class="loading-sq"></span><span class="loading-sq"></span>
      <img class="loading-pawn" src="pawn.png" alt="">
    </div>
  </div>
  <p class="loading-text">setting up the board<span class="loading-dots"><i></i><i></i><i></i></span></p>
</div>

<div class="table-felt" aria-hidden="true"></div>

<main id="app" class="app">

<header class="topbar" style="--i:0">
  <span class="topbar-plaque">
    <img class="logo" src="pawn.png" alt="Pawn">
  </span>
  <div class="topbar-text">
    <h1>Chess Stats</h1>
    <span class="topbar-sub">a ledger of every move that mattered</span>
  </div>
  <span class="topbar-piece" aria-hidden="true">&#9816;</span>
</header>

<p id="error" class="error" hidden></p>

<section id="profile" class="profile" hidden style="--i:1">
  <div class="profile-seal">
    <img id="avatar" alt="">
  </div>
  <div class="profile-info">
    <p id="display-name" class="name"></p>
    <p id="handle" class="handle"></p>
    <div class="milestones">
      <span id="joined"></span>
      <span id="peak-rating"></span>
      <span id="total-games"></span>
    </div>
  </div>
  <a id="challenge-link" class="challenge-btn" target="_blank" rel="noopener">Challenge me &#9658;</a>
</section>

<section id="stats" class="stats" style="--i:2"></section>

<section id="performance" class="performance" hidden style="--i:3">
  <span class="felt-tag">Board Report</span>
  <div class="split">
    <div class="split-row">
      <span>White</span>
      <div class="split-bar"><div id="white-bar" class="split-fill"></div></div>
      <span id="white-pct"></span>
    </div>
    <div class="split-row">
      <span>Black</span>
      <div class="split-bar"><div id="black-bar" class="split-fill black"></div></div>
      <span id="black-pct"></span>
    </div>
  </div>

  <div class="term-section">
    <span class="sub-label">how the games ended</span>
    <div class="term-bar">
      <div id="term-mate" class="seg mate" title="Checkmate"></div>
      <div id="term-resign" class="seg resign" title="Resignation"></div>
      <div id="term-timeout" class="seg timeout" title="Timeout"></div>
      <div id="term-draw" class="seg draw" title="Draw"></div>
    </div>
    <div class="term-legend">
      <span class="leg mate">Mate</span>
      <span class="leg resign">Resign</span>
      <span class="leg timeout">Time</span>
      <span class="leg draw">Draw</span>
    </div>
  </div>

  <div class="meta-metrics">
    <span id="avg-moves"></span>
    <span id="streak"></span>
  </div>
</section>

<div class="ledger-pair" style="--i:4">
  <section id="opponents" class="opponents"></section>
  <section id="openings" class="openings"></section>
</div>

<section id="games" class="games" style="--i:5"></section>

</main>

<!-- Game Viewer Modal -->
<div id="game-modal" class="modal" hidden>
  <div class="modal-content">
    <button id="modal-close" class="modal-close">&times;</button>
    <h3 id="modal-title">Game Review</h3>

    <div id="eval-graph" class="eval-graph">
      <div class="eval-graph-head">
        <span class="eval-label">Evaluation</span>
        <span id="eval-readout" class="eval-readout">+0.0</span>
      </div>
      <svg id="eval-svg" class="eval-svg" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
      <div class="eval-foot">
        <span id="eval-summary" class="eval-summary"></span>
        <span id="eval-progress" class="eval-progress"></span>
      </div>
    </div>

    <div class="viewer-body">
      <div id="board-wrap" class="board-wrap">
        <div id="board" style="width: 260px; margin: 0 auto;"></div>
      </div>
      <div id="pgn-moves" class="pgn-moves"></div>
    </div>

    <div class="modal-controls">
      <button id="first-move">&vert;&lt;</button>
      <button id="prev-move">&lt;</button>
      <button id="play-move">&#9658;</button>
      <button id="next-move">&gt;</button>
      <button id="last-move">&gt;&vert;</button>
    </div>
  </div>
</div>

<template id="stat-card">
  <article class="card">
    <div class="card-head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
      <span class="card-title"></span>
    </div>
    <p class="rating"></p>
    <svg class="sparkline" viewBox="0 0 100 24" preserveAspectRatio="none"></svg>
    <div class="best">
      <svg class="icon small" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 3h12v4a6 6 0 01-5 5.92V16h3v2H8v-2h3v-3.08A6 6 0 016 7V3z" fill="currentColor"/>
        <path d="M4 5h2v3a3 3 0 01-2-2.82V5z" fill="currentColor"/>
        <path d="M20 5h-2v3a3 3 0 002-2.82V5z" fill="currentColor"/>
      </svg>
      <span class="best-value"></span>
    </div>
    <p class="win-pct"></p>
    <div class="record"></div>
    <div class="record-bar">
      <div class="seg win"></div>
      <div class="seg draw"></div>
      <div class="seg loss"></div>
    </div>
  </article>
</template>

<template id="opening-row">
  <div class="opening-row">
    <span class="opening-name"></span>
    <span class="opening-winrate"></span>
  </div>
</template>

<template id="opponent-row">
  <div class="opponent-row">
    <span class="opp-name"></span>
    <span class="opp-h2h"></span>
  </div>
</template>

<template id="game-row">
  <div class="game-row clickable">
    <svg class="icon small result-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"></svg>
    <span class="opponent"></span>
    <span class="opp-rating"></span>
    <span class="format"></span>
    <span class="accuracy"></span>
    <span class="result-reason"></span>
    <span class="moves"></span>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js"></script>
<script src="script.js"></script>
<script>
  // Loading screen holds for exactly 3 seconds, then reveals the board.
  setTimeout(function () {
    var loader = document.getElementById('loading-screen');
    loader.classList.add('is-hiding');
    document.body.classList.add('is-revealed');
    setTimeout(function () { loader.hidden = true; }, 650);
  }, 3000);
</script>
</body>
</html>
